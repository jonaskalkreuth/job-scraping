# Skills taxonomy — hand-curated seed for dictionary-based extraction.
#
# Schema: a flat list under `skills:`. Each record is self-describing:
#   - name:     canonical skill label (lower-case; what charts/reports show)
#   - category: one of the buckets below (used for grouping demand by area)
#   - aliases:  other spellings/abbreviations that should count as a hit
#
# Alias policy is MODERATE: include common, *safe* abbreviations recruiters
# actually write. Stay conservative on ambiguous short forms — single-letter
# or dictionary-word skills (r, c, sas, go, stats) carry NO loose aliases and
# must be matched case-sensitively + word-bounded in extraction (step 6).
#
# Scope: hard tech + methods/concepts. No soft skills (they're everywhere and
# low-signal; promote any interesting ones later via n-gram mining, step 14).

skills:
  # --- languages ---------------------------------------------------------
  - name: python
    category: languages
    aliases: [py]
  - name: sql
    category: languages
    aliases: []
  - name: r
    category: languages
    aliases: []            # single letter — case-sensitive, no aliases
    case_sensitive: true   # match "R" only, never the bare letter "r" in prose
  - name: java
    category: languages
    aliases: []
  - name: scala
    category: languages
    aliases: []
  - name: javascript
    category: languages
    aliases: [js]
  - name: go
    category: languages
    aliases: [golang]      # bare "go" is ambiguous; "golang" is the safe form
    case_sensitive: true   # match "Go"/"GO", not the verb "go"
  - name: sas
    category: languages
    aliases: []            # also a vendor word — case-sensitive in extraction
    case_sensitive: true   # match "SAS", not the lowercase "sas"

